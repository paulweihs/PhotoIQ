<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#60aaff" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#0078d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#004a8f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circle">
      <circle cx="128" cy="128" r="120"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <circle cx="128" cy="128" r="115" fill="none" stroke="#0078d4" stroke-width="3" opacity="0.6"/>

  <!-- Aperture blades (6-blade camera aperture) -->
  <g clip-path="url(#circle)" filter="url(#glow)">
    <!-- Each blade is a rotated shape centered at the aperture opening -->
    <g transform="translate(128,128)">
      <!-- Blade 1 -->
      <path d="M 0,-45 Q 38,-32 45,0 Q 10,-8 0,-45 Z"
            fill="#0078d4" opacity="0.85" transform="rotate(0)"/>
      <!-- Blade 2 -->
      <path d="M 0,-45 Q 38,-32 45,0 Q 10,-8 0,-45 Z"
            fill="#0078d4" opacity="0.85" transform="rotate(60)"/>
      <!-- Blade 3 -->
      <path d="M 0,-45 Q 38,-32 45,0 Q 10,-8 0,-45 Z"
            fill="#0078d4" opacity="0.85" transform="rotate(120)"/>
      <!-- Blade 4 -->
      <path d="M 0,-45 Q 38,-32 45,0 Q 10,-8 0,-45 Z"
            fill="#0078d4" opacity="0.85" transform="rotate(180)"/>
      <!-- Blade 5 -->
      <path d="M 0,-45 Q 38,-32 45,0 Q 10,-8 0,-45 Z"
            fill="#0078d4" opacity="0.85" transform="rotate(240)"/>
      <!-- Blade 6 -->
      <path d="M 0,-45 Q 38,-32 45,0 Q 10,-8 0,-45 Z"
            fill="#0078d4" opacity="0.85" transform="rotate(300)"/>
    </g>
  </g>

  <!-- Aperture opening / lens glow -->
  <circle cx="128" cy="128" r="38" fill="url(#lensGlow)"/>
  <circle cx="128" cy="128" r="28" fill="#0a1628" opacity="0.95"/>

  <!-- AI sparkle — 4-pointed star in center -->
  <g transform="translate(128,128)" fill="#60aaff" filter="url(#glow)">
    <polygon points="0,-14  3,-3  14,0  3,3  0,14  -3,3  -14,0  -3,-3"
             opacity="0.95"/>
  </g>

  <!-- Small dot highlights on the aperture ring -->
  <circle cx="128" cy="83"  r="3" fill="#60aaff" opacity="0.7"/>
  <circle cx="167" cy="105" r="3" fill="#60aaff" opacity="0.5"/>
  <circle cx="167" cy="151" r="3" fill="#60aaff" opacity="0.5"/>
  <circle cx="128" cy="173" r="3" fill="#60aaff" opacity="0.7"/>
  <circle cx="89"  cy="151" r="3" fill="#60aaff" opacity="0.5"/>
  <circle cx="89"  cy="105" r="3" fill="#60aaff" opacity="0.5"/>
</svg>
